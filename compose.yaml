services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U helpdesk -d helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  helpdesk_data:
